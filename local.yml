---
# local.yml - entry playbook, run against localhost by update-env.sh
# (ansible-playbook -i 'localhost,' -c local local.yml). Pass -e upgrade=true
# for the bump-to-latest path; default is install-missing-only.
#
# Role order matters:
#   1. common          - gather facts, sanity-check the environment
#   2. native_packages - low-level utils from apt/dnf (platform binaries)
#   3. homebrew        - install brew + fast-moving tools + toolchains (node/uv)
#   4. golang          - install Go via Homebrew
#   5. rust            - install Rust via rustup + rust-analyzer
#   6. oom_edit        - clone and release-build the oom-edit Markdown editor
#   7. lang_tools      - helix LSPs/formatters via go/cargo/npm/uv
#   8. dotfiles        - hand off to the existing bare-repo dotfiles process

- name: Provision local development machine
  hosts: localhost
  connection: local
  gather_facts: true

  # Most package tasks need root on Linux; Homebrew and dotfiles must NOT.
  # We therefore do not set a blanket `become: true` here -- each role opts
  # in per-task. This keeps brew/dotfiles running as the invoking user.
  become: false

  pre_tasks:
    - name: Assert we are on a supported OS
      ansible.builtin.assert:
        that:
          - ansible_facts['system'] in ['Linux', 'Darwin']
        fail_msg: >-
          Unsupported system '{{ ansible_facts['system'] }}'.
          This playbook supports Linux and macOS only.

    - name: Assert Linux is a supported family
      ansible.builtin.assert:
        that:
          - ansible_facts['os_family'] in ['Debian', 'RedHat']
        fail_msg: >-
          Unsupported Linux family '{{ ansible_facts['os_family'] }}'.
          Supported: Debian, RedHat (Enterprise Linux).
      when: ansible_facts['system'] == 'Linux'

  roles:
    - role: common
    - role: native_packages
    - role: homebrew
    - role: golang
    - role: rust
    - role: oom_edit
    - role: lang_tools
    - role: dotfiles
