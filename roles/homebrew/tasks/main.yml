---
# homebrew role - install Homebrew if absent (Linux + macOS), then install /
# upgrade a list of formulae. All brew operations run as the invoking user,
# never root.

- name: Determine Homebrew prefix
  ansible.builtin.set_fact:
    brew_prefix: >-
      {{ '/opt/homebrew' if (ansible_facts['system'] == 'Darwin' and ansible_facts['architecture'] == 'arm64')
         else '/usr/local' if ansible_facts['system'] == 'Darwin'
         else '/home/linuxbrew/.linuxbrew' }}

- name: Check whether brew is already on PATH
  ansible.builtin.command: brew --version
  register: brew_check
  changed_when: false
  failed_when: false

- name: Check for brew binary at expected prefix
  ansible.builtin.stat:
    path: "{{ brew_prefix }}/bin/brew"
  register: brew_bin

# On Linux the install prefix is /home/linuxbrew/.linuxbrew, but /home is
# root-owned, so the installer needs root to create it. It tries to do that with
# its own `sudo`, which fails here: Ansible runs the install shell without a TTY
# and does not feed it the become password, so the installer's sudo cannot
# authenticate ("Insufficient permissions to install Homebrew..."). We instead
# create the prefix as root ourselves and hand it to the invoking user. The
# installer then sees a writable prefix and never needs sudo. (macOS is left to
# the installer: its prefixes -- /opt/homebrew, /usr/local -- have their own
# ownership conventions we should not blanket-chown.)
- name: Pre-create Homebrew prefix owned by the invoking user (Linux)
  become: true
  ansible.builtin.file:
    path: "{{ brew_prefix }}"
    state: directory
    owner: "{{ ansible_facts['user_id'] }}"
    mode: "0755"
    recurse: true
  when:
    - ansible_facts['system'] == 'Linux'
    - brew_check.rc != 0
    - not brew_bin.stat.exists

- name: Install Homebrew (non-interactive)
  ansible.builtin.shell: >-
    /bin/bash -c "$(curl -fsSL
    https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
  environment:
    NONINTERACTIVE: "1"
  when:
    - brew_check.rc != 0
    - not brew_bin.stat.exists
  changed_when: true

# Tell the homebrew modules exactly where brew lives, since a freshly installed
# brew is not yet on this Ansible session's PATH. brew always lives at
# <prefix>/bin regardless of how it was installed.
- name: Resolve brew bin directory
  ansible.builtin.set_fact:
    brew_bin_dir: "{{ brew_prefix }}/bin"

# community.general.homebrew 6.x detects installed state by scraping
# `brew info` text output for "Poured from bottle" / "Built from source".
# Homebrew 6+ changed that output, breaking detection for every formula. The
# fix (JSON-based detection) landed in community.general 7.0.0, but rather
# than pinning a specific collection version range (7.x-9.x for ansible-core
# 2.14 compat), we drive brew directly: `brew list --formula` and
# `brew outdated --formula` are stable, machine-readable APIs that won't
# break across brew or collection releases.
#
# On macOS we also pull in the low-level utils that Linux gets from its native
# package manager. Everything here lives in homebrew-core (trusted by default);
# no third-party taps are used, so there is no tap-trust gate to work around.

- name: Gather installed Homebrew formulae
  ansible.builtin.command: "{{ brew_bin_dir }}/brew list --formula"
  register: brew_installed
  changed_when: false
  check_mode: false

- name: Build list of wanted formulae
  ansible.builtin.set_fact:
    brew_wanted: >-
      {{ homebrew_formulae
         + (homebrew_formulae_darwin if ansible_facts['system'] == 'Darwin' else []) }}

- name: Compute missing formulae
  ansible.builtin.set_fact:
    brew_missing: "{{ brew_wanted | difference(brew_installed.stdout_lines) }}"

# Default (upgrade=false): install only what is missing. A steady-state
# converge produces changed=0 because the loop body never executes.
- name: Install missing Homebrew formulae
  ansible.builtin.command: "{{ brew_bin_dir }}/brew install {{ item }}"
  loop: "{{ brew_missing }}"
  when: not (upgrade | bool)

# Upgrade (upgrade=true): refresh the formula index, then install anything
# missing and upgrade anything outdated.
- name: Update Homebrew formula index
  ansible.builtin.command: "{{ brew_bin_dir }}/brew update"
  when: upgrade | bool
  changed_when: false

- name: Install missing Homebrew formulae (upgrade path)
  ansible.builtin.command: "{{ brew_bin_dir }}/brew install {{ item }}"
  loop: "{{ brew_missing }}"
  when: upgrade | bool

- name: Gather outdated Homebrew formulae
  ansible.builtin.command: "{{ brew_bin_dir }}/brew outdated --formula"
  register: brew_outdated
  changed_when: false
  check_mode: false
  when: upgrade | bool

- name: Upgrade outdated Homebrew formulae
  ansible.builtin.command: "{{ brew_bin_dir }}/brew upgrade {{ item }}"
  loop: "{{ brew_wanted | intersect(brew_outdated.stdout_lines | default([])) }}"
  when: upgrade | bool

- name: Reminder to add brew to shell init (Linux)
  ansible.builtin.debug:
    msg: >-
      Ensure your dotfiles eval the brew shellenv on Linux:
      eval "$({{ brew_prefix }}/bin/brew shellenv)"
  when: ansible_facts['system'] == 'Linux'
