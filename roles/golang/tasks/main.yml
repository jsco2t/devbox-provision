---
# golang role - install the Go toolchain from Homebrew (both Linux and macOS).
#
# Go is installed via brew per request; this mirrors the rust role as a
# dedicated toolchain role. It must run after the homebrew role, which installs
# brew and sets the `brew_prefix` / `brew_bin_dir` facts.
#
# Runs as the invoking user (brew never runs as root). Default installs Go only
# if missing (no `brew update`); upgrade mode bumps it to the current release.

# Bypass community.general.homebrew (its text-scraping installed-detection is
# broken against Homebrew 6+; see the comment block in the homebrew role).

- name: Check whether Go is already installed via Homebrew
  ansible.builtin.command: "{{ brew_bin_dir }}/brew list go"
  register: go_brew_check
  changed_when: false
  failed_when: false
  check_mode: false

- name: Install Go via Homebrew
  ansible.builtin.command: "{{ brew_bin_dir }}/brew install go"
  when: go_brew_check.rc != 0

- name: Check whether Go is outdated
  ansible.builtin.command: "{{ brew_bin_dir }}/brew outdated go"
  register: go_outdated_check
  changed_when: false
  failed_when: false
  check_mode: false
  when:
    - upgrade | bool
    - go_brew_check.rc == 0

- name: Upgrade Go to latest via Homebrew
  ansible.builtin.command: "{{ brew_bin_dir }}/brew upgrade go"
  when:
    - upgrade | bool
    - go_brew_check.rc == 0
    - go_outdated_check.stdout_lines | default([]) | length > 0
